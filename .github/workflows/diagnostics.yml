name: Picker rendering probe

# Diagnostic: the unit suite drives the picker through a tkinter stub, so a
# mistake in the *real* Tk calls would never show up there. This job opens the
# real editor on Windows and Linux, reads the pixels back out of the PhotoImage
# Tk stored, and uploads a screenshot of the window.
#
# It also checks the self-update restart on Windows: a freshly started onefile
# build must survive inheriting a stale PyInstaller environment (the "Error
# loading Python DLL" reported after updating), which is what the swap script
# now prevents.
#
# It runs on the default branch (so a released state is verified on every
# merge) or on demand. It deliberately does not run on every feature-branch
# push: the probe takes minutes on two operating systems.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/25b58ad1-autotyper   # TEMPORARY: verify v1.1.3 on this branch
    paths:
      - "tools/render_picker_probe.py"
      - "tools/update_restart_probe.py"
      - "tools/update_restart_probe_broken.py"
      - "auto_typer.py"
      - "AutoTyper.spec"
      - ".github/workflows/diagnostics.yml"

permissions:
  contents: read

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow (screenshots) and a display (Linux)
        shell: bash
        run: |
          python -m pip install --quiet pillow
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb xauth imagemagick
          fi

      - name: Probe the picker with a real Tk
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python tools/render_picker_probe.py --out probe-out
          else
            python tools/render_picker_probe.py --out probe-out
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: picker-${{ matrix.os }}
          path: probe-out/

  restart:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build a onefile console probe build
        # Console subsystem on purpose: the windowed build reports bootloader
        # errors in a message box, which would hang the runner instead of
        # failing. The onefile environment handling under test is identical.
        run: pyinstaller --onefile --console --noconfirm --name AutoTyperProbe --distpath dist-probe auto_typer.py

      - name: Prove the swap script's clearing lines empty the onefile environment
        shell: python
        run: |
          # "Error loading Python DLL" after an update comes from the new build
          # inheriting the previous process's unpacked-file paths. The swap
          # script clears those variables before starting it, and this runs the
          # *generated* lines on a real cmd.exe to show that they really do.
          import pathlib
          import subprocess
          import sys

          sys.path.insert(0, ".")
          import auto_typer as at

          script = at.build_windows_swap_script(r"C:\Temp\new.exe", r"C:\Temp\target.exe",
                                                version="1.0.0")
          clearing = [line for line in script.splitlines()
                      if line.startswith('set "') and "=" in line
                      and (line.startswith('set "_PYI') or line.startswith('set "_MEI')
                           or line.startswith('set "PYINSTALLER'))]
          if not clearing:
              sys.exit("the generated swap script clears nothing")

          body = ["@echo off"]
          # What the running onefile app has in its environment...
          body += [f'set "{name}=stale-value"' for name in at.PYINSTALLER_RUNTIME_ENV_VARS]
          # ...then exactly the lines the swap script uses, verbatim.
          body += clearing
          body += [f'echo {name}=[%{name}%]' for name in at.PYINSTALLER_RUNTIME_ENV_VARS]
          body += ['echo RESET=[%PYINSTALLER_RESET_ENVIRONMENT%]']

          bat = pathlib.Path("onefile-env.bat")
          bat.write_text("\r\n".join(body) + "\r\n", encoding="utf-8")
          out = subprocess.run(["cmd", "/c", str(bat)], capture_output=True, text=True).stdout
          print(out)
          for name in at.PYINSTALLER_RUNTIME_ENV_VARS:
              if f"{name}=[]" not in out:
                  sys.exit(f"{name} survived the swap script's clearing lines")
          if "RESET=[1]" not in out:
              sys.exit("the reset request is not handed to the new build")

      - name: Build the ends of a real self-update (old, new and broken builds)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p e2e/old/tools e2e/new/tools
          for tree in old new; do
            cp auto_typer.py "e2e/$tree/auto_typer.py"
            cp tools/update_restart_probe.py "e2e/$tree/tools/update_restart_probe.py"
          done
          # The "new" build is a genuinely different build: bump its version.
          python - "$PWD" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1]) / "e2e" / "new" / "auto_typer.py"
          text = root.read_text(encoding="utf-8")
          root.write_text(re.sub(r'APP_VERSION = "[^"]+"', 'APP_VERSION = "9.9.9"', text, count=1),
                          encoding="utf-8")
          PY
          pyinstaller --onefile --console --noconfirm --name OldBuild --distpath e2e/dist \
            --workpath e2e/work-old --specpath e2e/spec --paths e2e/old \
            e2e/old/tools/update_restart_probe.py
          pyinstaller --onefile --console --noconfirm --name NewBuild --distpath e2e/dist \
            --workpath e2e/work-new --specpath e2e/spec --paths e2e/new \
            e2e/new/tools/update_restart_probe.py
          pyinstaller --onefile --console --noconfirm --name BrokenBuild --distpath e2e/dist \
            --workpath e2e/work-broken --specpath e2e/spec \
            tools/update_restart_probe_broken.py
          ls -l e2e/dist

      # The two steps below are the ones that test the *reported* failure on a
      # real machine. They report everything they know through the check-run
      # API (annotations and the step summary), because the job logs of a
      # Windows runner are not always reachable from where this is reviewed.
      - name: A real update replaces the build, and the new build comes up
        shell: pwsh
        run: |
          $app = Join-Path $PWD "e2e/app/AutoTyper.exe"
          $data = Join-Path $env:LOCALAPPDATA "AutoTyper"
          New-Item -ItemType Directory -Force -Path (Split-Path $app) | Out-Null
          Copy-Item "e2e/dist/OldBuild.exe" $app
          $new = (Resolve-Path "e2e/dist/NewBuild.exe").Path
          $report = Join-Path $data "probe-report.txt"
          Remove-Item $report -ErrorAction SilentlyContinue

          $state = [ordered]@{}
          try {
            & $app --self-update $app $new 9.9.9
            $state["probe_exit"] = $LASTEXITCODE
            if ($LASTEXITCODE -ne 0) { throw "the probe could not stage the update" }

            $deadline = (Get-Date).AddSeconds(180)
            while ((Get-Date) -lt $deadline -and (Get-FileHash $app).Hash -ne (Get-FileHash $new).Hash) {
              Start-Sleep -Seconds 1
            }
            $state["installed_hash"] = (Get-FileHash $app).Hash
            $state["new_hash"] = (Get-FileHash $new).Hash
            $state["verdict"] = (Get-Content (Join-Path $data "update-result.txt") -Raw -ErrorAction SilentlyContinue)
            $state["report"] = (Get-Content $report -Raw -ErrorAction SilentlyContinue)
            $state["app_log"] = (Get-Content (Join-Path $data "AutoTyper.log") -Raw -ErrorAction SilentlyContinue)
            $state["swap_log"] = (Get-Content (Join-Path $data "AutoTyper-update.log") -Raw -ErrorAction SilentlyContinue)

            if ($state["installed_hash"] -ne $state["new_hash"]) {
              throw "the installed build was never replaced by the new one"
            }
            if ($state["verdict"] -notmatch "ok v9\.9\.9") {
              throw "the swap script did not report a started build: $($state["verdict"])"
            }
            if ($state["report"] -notmatch "v9\.9\.9 started from") {
              throw "the wrong build answered: $($state["report"])"
            }
            if ($state["report"] -notmatch "\(own\)") {
              throw "the new build is not using its own extraction folder: $($state["report"])"
            }
            Write-Host "::notice::AUTOTYPER-E2E-UPDATE:$(($state | ConvertTo-Json -Compress))"
          } catch {
            $state["error"] = "$_"
            $json = ($state | ConvertTo-Json -Compress)
            Write-Host "::error::AUTOTYPER-E2E-UPDATE-FAIL:$json"
            "## End-to-end update failure" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            ($state | ConvertTo-Json) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            throw
          }

      - name: A new build that never starts is rolled back and the app comes back
        shell: pwsh
        run: |
          $app = Join-Path $PWD "e2e/app/AutoTyper.exe"
          $data = Join-Path $env:LOCALAPPDATA "AutoTyper"
          $good = (Resolve-Path "e2e/dist/NewBuild.exe").Path
          $broken = (Resolve-Path "e2e/dist/BrokenBuild.exe").Path
          $report = Join-Path $data "probe-report.txt"
          $result = Join-Path $data "update-result.txt"
          Remove-Item $result -ErrorAction SilentlyContinue
          $goodHash = (Get-FileHash $good).Hash
          $before = (Get-Content $report -Raw).Split("`n").Count

          $state = [ordered]@{}
          try {
            # A short watch window: CI should not have to wait a minute for it.
            & $app --self-update $app $broken 0.0.0 --watch 15
            $state["probe_exit"] = $LASTEXITCODE
            if ($LASTEXITCODE -ne 0) { throw "the probe could not stage the rollback case" }

            $deadline = (Get-Date).AddSeconds(180)
            while ((Get-Date) -lt $deadline -and -not (Test-Path $result)) { Start-Sleep -Seconds 1 }
            $state["verdict"] = (Get-Content $result -Raw -ErrorAction SilentlyContinue)
            if ($state["verdict"] -notmatch "rolled-back v0\.0\.0") {
              throw "expected a rollback, got: $($state["verdict"])"
            }
            $state["restored_hash"] = (Get-FileHash $app).Hash
            $state["good_hash"] = $goodHash
            if ($state["restored_hash"] -ne $goodHash) { throw "the working build was not restored" }

            # ...and the restored build has to be started again, not just put back.
            $deadline = (Get-Date).AddSeconds(90)
            while ((Get-Date) -lt $deadline) {
              $lines = (Get-Content $report -Raw).Split("`n")
              if ($lines.Count -gt $before -and ($lines -join "`n") -match "v9\.9\.9 started from") { break }
              Start-Sleep -Seconds 1
            }
            $state["report"] = (Get-Content $report -Raw -ErrorAction SilentlyContinue)
            $state["swap_log"] = (Get-Content (Join-Path $data "AutoTyper-update.log") -Raw -ErrorAction SilentlyContinue)
            $lines = $state["report"].Split("`n")
            if ($lines.Count -le $before) { throw "the restored build was never started" }
            Write-Host "::notice::AUTOTYPER-E2E-ROLLBACK:$(($state | ConvertTo-Json -Compress))"
          } catch {
            $state["error"] = "$_"
            $json = ($state | ConvertTo-Json -Compress)
            Write-Host "::error::AUTOTYPER-E2E-ROLLBACK-FAIL:$json"
            "## End-to-end rollback failure" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            ($state | ConvertTo-Json) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            throw
          }

      - name: Check a onefile build starts with a stale PyInstaller environment
        shell: pwsh
        run: |
          # The update swap script starts the new build with PyInstaller's
          # onefile variables cleared and PYINSTALLER_RESET_ENVIRONMENT=1.
          # This reproduces the relaunch both ways round: with a stale
          # environment (the reported "Error loading Python DLL" after an
          # update) and with the clear-out the script performs.
          $exe = (Resolve-Path "dist-probe\AutoTyperProbe.exe").Path
          $staleDir = Join-Path $env:TEMP "stale-mei"
          New-Item -ItemType Directory -Force -Path $staleDir | Out-Null

          function Try-Launch($label) {
            $out = Join-Path $env:TEMP "launch-$label.txt"
            $err = Join-Path $env:TEMP "launch-$label.err"
            Remove-Item $out, $err -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $exe -ArgumentList "--benchmark", "--chars", "200" `
                 -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
            if (-not $p.WaitForExit(120000)) { $p.Kill(); return "hung" }
            $text = Get-Content $out -Raw -ErrorAction SilentlyContinue
            $problems = Get-Content $err -Raw -ErrorAction SilentlyContinue
            Write-Host "--- $label (exit $($p.ExitCode)) ---"
            if ($text) { Write-Host $text }
            if ($problems) { Write-Host "stderr: $problems" }
            if ($problems -match "Python DLL") { return "dll-error" }
            if ($p.ExitCode -ne 0) { return "exit-$($p.ExitCode)" }
            if ($text -notmatch "AutoTyper Biomechanical") { return "no-output" }
            return "started"
          }

          $clean = Try-Launch "clean"
          if ($clean -ne "started") { throw "clean launch failed: $clean" }

          # The environment a running onefile build leaves behind for its
          # children: its extraction folder (deleted when it exits) and its own
          # process level.
          $env:_PYI_APPLICATION_HOME_DIR = $staleDir
          $env:_PYI_ARCHIVE_FILE = $exe
          $env:_PYI_PARENT_PROCESS_LEVEL = "1"
          $stale = Try-Launch "stale"
          Write-Host "stale environment result: $stale"

          # Same stale environment plus the clear-out the swap script performs.
          $env:PYINSTALLER_RESET_ENVIRONMENT = "1"
          $reset = Try-Launch "stale-but-reset"
          Write-Host "relaunch with the swap script's environment: $reset"
          Write-Host "::notice::AUTOTYPER-RESTART:{`"clean`":`"$clean`",`"stale`":`"$stale`",`"reset`":`"$reset`"}"
          if ($reset -ne "started") { throw "fixed relaunch failed: $reset" }
          if ($stale -eq "dll-error") {
            Write-Host "Reproduced the reported failure, and the swap script's environment fixes it."
          } else {
            Write-Host "NOTE: the stale environment no longer breaks the bootloader here ($stale)"
          }
